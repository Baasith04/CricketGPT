services:
  - type: web
    name: cricketgpt-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: groq
      - key: AI_PROVIDER_ORDER
        value: groq,gemini,mistral,nvidia
      - key: AI_TIMEOUT
        value: "30"
      - key: AI_MAX_TOKENS
        value: "1000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: RAG_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: RAG_EMBEDDING_DIMENSION
        value: "768"
      - key: INGESTION_API_KEY
        sync: false
      - key: GEMINI_KNOWLEDGE_CUTOFF_DATE
        value: "2024-03-01"
      - key: GEMINI_KNOWLEDGE_CUTOFF_SEASON
        value: "2023"
      - key: CORS_ALLOW_ORIGINS
        value: ""
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_STORAGE_URI
        value: ""
      - key: RATE_LIMIT_CHAT
        value: "20/minute"
      - key: RATE_LIMIT_RAG_SEARCH
        value: "60/minute"
      - key: RATE_LIMIT_RAG_INGEST
        value: "10/minute"
      - key: TRUSTED_PROXY_CIDRS
        value: ""

  - type: cron
    name: cricketgpt-cricsheet-sync
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_sync.py --triggered-by cron
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: AI_TIMEOUT
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAG_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: RAG_EMBEDDING_DIMENSION
        value: "768"

